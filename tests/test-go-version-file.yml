name: Test go_version_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a go version file for testing
        run: |
          echo "1.22" > /tmp/go-version-file.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          go_version_file: "/tmp/go-version-file.txt"
          reporter: "github-check"
          filter_mode: "nofilter"
          fail_level: "none"
      - name: Assert action ran (go_version_file input accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with go_version_file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
