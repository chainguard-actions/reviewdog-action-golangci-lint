name: Test custom tool name and level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: golangci-custom
          level: warning
          reporter: github-check
          filter_mode: nofilter
          fail_level: none

      - name: Assert action ran with custom options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom tool_name and level"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected under sentinel repo / no PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
