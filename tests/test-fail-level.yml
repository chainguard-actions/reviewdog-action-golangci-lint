name: Test golangci-lint fail_level behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Go module with clean code (no lint issues)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/clean-sample"
          cat > "$GITHUB_WORKSPACE/tests/clean-sample/go.mod" << 'EOF'
          module example.com/clean

          go 1.21
          EOF
          cat > "$GITHUB_WORKSPACE/tests/clean-sample/main.go" << 'EOF'
          package main

          import "fmt"

          func main() {
          	fmt.Println("clean code")
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          workdir: tests/clean-sample
          golangci_lint_flags: "--timeout=60s --disable-all --enable=gofmt"

      - name: Assert action ran with fail_level=none
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with fail_level=none"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
