name: Test fail_level behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a Go module with lint issues
        run: |
          mkdir -p /tmp/goproject-lint
          cat > /tmp/goproject-lint/go.mod << 'EOF'
          module example.com/linttest

          go 1.21
          EOF
          # Create a file with an unused variable (lint issue)
          cat > /tmp/goproject-lint/main.go << 'EOF'
          package main

          import "fmt"

          func main() {
          	x := 42
          	fmt.Println("Hello")
          	_ = x
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          workdir: /tmp/goproject-lint
          golangci_lint_flags: "--timeout=2m"

      - name: Assert action ran with fail_level none (should not fail due to lint issues)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=none, reviewdog always exits 0 regardless of findings
          # The action may still fail due to sentinel repo / API issues, but not due to lint
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with fail_level=none"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / workflow_dispatch context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
