name: Test fail_level input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action ran with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error the action may succeed (no errors) or fail (errors found or sentinel repo)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with fail_level=error, outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
