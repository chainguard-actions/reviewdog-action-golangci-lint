name: Test workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Go module in a subdirectory
        run: |
          mkdir -p tests/fixtures/gomod
          cat > tests/fixtures/gomod/go.mod << 'EOF'
          module example.com/testmod

          go 1.21
          EOF
          cat > tests/fixtures/gomod/main.go << 'EOF'
          package main

          import "fmt"

          func main() {
            fmt.Println("hello")
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/gomod

      - name: Assert action ran with custom workdir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom workdir"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected under sentinel repo / no PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
