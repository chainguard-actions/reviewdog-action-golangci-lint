name: check golangci-lint config
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        golangci-lint-version: ["v1", "v2"]
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set TAG_NAME
        if: ${{ matrix.golangci-lint-version == 'v1' }}
        run: echo "TAG_NAME=v1.64.8" >> "$GITHUB_ENV"
      - name: Set TAG_NAME
        if: ${{ matrix.golangci-lint-version != 'v1' }}
        env:
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          raw_tag=$(gh release list --repo golangci/golangci-lint --json name,isLatest --jq '.[] | select(.isLatest) | .name')
          safe_tag=$(printf '%s' "$raw_tag" | tr -d '\n\r')
          echo "TAG_NAME=$safe_tag" >> "$GITHUB_ENV"
      - name: Install golangci-lint
        run: |
          INSTALL_SCRIPT="$(mktemp)"
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/refs/tags/$TAG_NAME/install.sh" -o "$INSTALL_SCRIPT"
          sh "$INSTALL_SCRIPT" -b "$(go env GOPATH)/bin" "$TAG_NAME"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate golangci-lint config
        env:
          GOLANGCI_LINT_VERSION: ${{ matrix.golangci-lint-version }}
        run: golangci-lint config verify --config=".github/.golangci.${GOLANGCI_LINT_VERSION}.yml"
